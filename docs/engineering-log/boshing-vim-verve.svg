<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Log quote card: boshing with vim and verve</title>
  <desc id="desc">A restrained smoked-glass engineering quote card for 32 Visualisations, with attribution to Andy J Myers.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.5" stop-color="#11161b"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="0.42" stop-color="#d7dee4" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12171b" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#07090c" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#020304" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="redEye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffede6" stop-opacity="0.86"/>
      <stop offset="0.16" stop-color="#d84232" stop-opacity="0.68"/>
      <stop offset="0.56" stop-color="#64110f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#space)"/>
  <g opacity="0.22">
    <path d="M0 96 H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 524 H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M108 0 V620" stroke="#ffffff" stroke-width="1"/>
    <path d="M1492 0 V620" stroke="#ffffff" stroke-width="1"/>
  </g>

  <rect x="112" y="92" width="1376" height="436" rx="22" fill="url(#glass)" stroke="#c8d0d6" stroke-opacity="0.16"/>
  <rect x="164" y="142" width="1272" height="336" rx="8" fill="url(#smoke)" filter="url(#panelShadow)"/>
  <rect x="164" y="142" width="1272" height="336" rx="8" fill="#ffffff" opacity="0.025"/>

  <circle cx="1312" cy="221" r="98" fill="url(#redEye)" opacity="0.62"/>
  <circle cx="1312" cy="221" r="8" fill="#f2f5f7" opacity="0.74"/>

  <text x="224" y="204" fill="#cfd7dc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="5">
    ENGINEERING LOG / 32 VISUALISATIONS
  </text>

  <line x1="224" y1="236" x2="1030" y2="236" stroke="#cfd7dc" stroke-opacity="0.24"/>
  <line x1="224" y1="242" x2="418" y2="242" stroke="#e6edf2" stroke-opacity="0.58" stroke-width="2"/>

  <text x="224" y="304" fill="#f4f7f8" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="500">
    <tspan x="224" dy="0">"Not only are we bishing and bashing, I should go much</tspan>
    <tspan x="224" dy="58">further and stake my entire reputation on the assertion</tspan>
    <tspan x="224" dy="58">that we are boshing with the utmost of vim and verve."</tspan>
  </text>

  <text x="224" y="452" fill="#dce3e7" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">
    Andy J Myers
  </text>
  <text x="448" y="452" fill="#8f9aa2" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400">
    Lead Engineer, 32 Visualisations
  </text>

  <g opacity="0.52">
    <text x="1234" y="418" fill="#77838a" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="2">
      STATUS: VERIFIED
    </text>
    <text x="1234" y="448" fill="#59646b" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="2">
      BISH / BASH / BOSH
    </text>
  </g>
</svg>
