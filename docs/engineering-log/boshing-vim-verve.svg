<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Log quote card: boshing with vim and verve</title>
  <desc id="desc">A ritzy angular quote card for 32 Visualisations, with attribution to Andy J Myers, Lead Engineer.</desc>
  <defs>
    <linearGradient id="carbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020308"/>
      <stop offset="0.42" stop-color="#071622"/>
      <stop offset="0.72" stop-color="#11061a"/>
      <stop offset="1" stop-color="#030406"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#765017"/>
      <stop offset="0.28" stop-color="#f6c65b"/>
      <stop offset="0.54" stop-color="#fff1a3"/>
      <stop offset="0.78" stop-color="#d18a22"/>
      <stop offset="1" stop-color="#5b350c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e7ff"/>
      <stop offset="0.48" stop-color="#286cff"/>
      <stop offset="1" stop-color="#ff35f6"/>
    </linearGradient>
    <pattern id="weave" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="34" height="34" fill="rgba(0,0,0,0)"/>
      <rect x="0" y="0" width="18" height="34" fill="#ffffff" opacity="0.022"/>
      <rect x="18" y="0" width="16" height="34" fill="#000000" opacity="0.18"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#carbon)"/>
  <rect width="1600" height="900" fill="url(#weave)" opacity="0.8"/>

  <path d="M-80 110 L420 20 L1640 115 L1540 250 L210 226 Z" fill="#06131d" opacity="0.72"/>
  <path d="M120 804 L672 690 L1700 742 L1506 934 L0 926 Z" fill="#100413" opacity="0.74"/>

  <circle cx="1330" cy="130" r="330" fill="#00e7ff" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="260" cy="760" r="320" fill="#ff35f6" opacity="0.11" filter="url(#softGlow)"/>

  <g filter="url(#smallShadow)">
    <path d="M116 144 L1358 144 L1486 264 L1402 756 L242 756 L116 626 Z" fill="#060b13" opacity="0.93"/>
    <path d="M138 166 L1346 166 L1460 274 L1382 734 L254 734 L138 616 Z" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M174 206 L1296 206 L1398 302 L1336 686 L286 686 L174 588 Z" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.88"/>
  </g>

  <g opacity="0.72">
    <path d="M82 100 L256 100" stroke="url(#gold)" stroke-width="8"/>
    <path d="M278 100 L378 100" stroke="#00e7ff" stroke-width="8"/>
    <path d="M1224 804 L1400 804" stroke="url(#gold)" stroke-width="8"/>
    <path d="M1422 804 L1518 804" stroke="#ff35f6" stroke-width="8"/>
  </g>

  <text x="210" y="254" fill="#00e7ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="7">
    ENGINEERING LOG // 32 VISUALISATIONS
  </text>

  <text x="204" y="356" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">
    <tspan x="204" dy="0">"Not only are we bishing and bashing,</tspan>
    <tspan x="204" dy="78">I should go much further and stake</tspan>
    <tspan x="204" dy="78">my entire reputation on the assertion</tspan>
    <tspan x="204" dy="78">that we are boshing with the utmost</tspan>
    <tspan x="204" dy="78">of vim and verve."</tspan>
  </text>

  <path d="M204 692 L624 692" stroke="url(#gold)" stroke-width="5"/>
  <text x="204" y="734" fill="#ffe493" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">
    Andy J Myers
  </text>
  <text x="470" y="734" fill="#d7e3ee" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">
    Lead Engineer, 32 Visualisations
  </text>

  <g transform="translate(1234 610)">
    <path d="M0 0 L176 -34 L252 34 L70 76 Z" fill="url(#gold)" opacity="0.18"/>
    <path d="M28 18 L172 -10 L222 34 L76 56 Z" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M68 34 L156 16" stroke="#00e7ff" stroke-width="4" opacity="0.8"/>
    <path d="M94 46 L196 26" stroke="#ff35f6" stroke-width="4" opacity="0.72"/>
  </g>
</svg>
